name: Review storyboard viewer changes
# Runs on pull requests only. It never deploys: publishing stays with pages.yml on pushes to main.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/storyboard/**'
      - 'story/**'
      - 'assets/**'
      - 'tools/sync/**'
      - 'tools/prologue-art-lab/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/storyboard-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Canonical drift check (chapters, routes, field contract, selected-art previews, status regression, game integration)
        run: node tools/sync/check-canon.mjs
      - name: Sync tool self-test (register-art refusals, status never lowered, regression detection)
        run: node tools/sync/qa-sync.mjs
      - name: Pages Batch D staging guard (23 approved-source references; only the recorded Paper Emergency v03 -> v04 replacement, with its preserved v03 copy)
        run: node tools/sync/qa-ch3-reference-supersession.mjs
      - name: Chapter 3 integration state (approved with no path, or integrated by a game build that used the exact approved bytes; wrong hashes, paths, reports and status regressions refused)
        run: node tools/sync/qa-ch3-integration-state.mjs
      - name: Storyboard logic, timeline layout and Prologue/Chapter 3 snapshot checks
        run: node tools/storyboard/qa-smoke.mjs
      - name: Verify death-popup game export matches authored fatal boxes
        run: node tools/storyboard/export-death-presentations.mjs --check
      - name: Prologue Artwork Lab pinned sources and explicit catalogue scope
        run: node tools/prologue-art-lab/qa/qa-static.mjs
      - name: Install Chromium and Firefox
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium firefox
      - name: Chapter navigation and layout persistence (Chromium + Firefox)
        run: node tools/storyboard/qa-browser.js
      - name: Timeline geometry, interactions and screenshots (Chromium + Firefox)
        run: node tools/storyboard/qa-timeline.js --out storyboard-timeline-qa
      - name: Selected-artwork previews (pixels, composites, states, items, zoom) (Chromium + Firefox)
        run: node tools/storyboard/qa-artwork-preview.js --out storyboard-timeline-qa/artwork-preview
      - name: Prologue Artwork Lab on the built Pages site, catalogue growth and scope fixtures (Chromium + Firefox)
        run: node tools/prologue-art-lab/qa/qa-pages-site.mjs --out storyboard-timeline-qa/prologue-art-lab
      - name: Prologue Artwork Lab historical six-slot behaviour (Chromium + Firefox)
        run: node tools/prologue-art-lab/qa/qa-browser.mjs
      - name: Preserve timeline screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-timeline-screenshots
          path: storyboard-timeline-qa/
          if-no-files-found: warn
