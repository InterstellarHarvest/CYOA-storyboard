name: Publish Out of Order Storyboard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'tools/storyboard/**'
      - 'tools/prologue-art-lab/**'
      - 'story/**'
      - 'assets/**'
      - 'tools/sync/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Immutable historical review galleries, published at build time from their pinned commits.
  CH3_BATCH_A_REVIEW_COMMIT: a87155bfadad42e0deae3bee2e749963d1459a4b
  CH3_BATCH_A_REVIEW_DIR: tools/prologue-art-lab/assets/review/chapter-03-batch01-2026-11-18
  CH3_BATCH_B_REVIEW_COMMIT: 7337e5e550e64a64357666a0fab6f118500913cd
  CH3_BATCH_B_REVIEW_DIR: tools/prologue-art-lab/assets/review/chapter-03-batch02-2026-11-19
  CH3_BATCH_C_REVIEW_COMMIT: 7bf1f426f3a1d5dba14e7a1bd56ece86a4d23bdb
  CH3_BATCH_C_REVIEW_DIR: tools/prologue-art-lab/assets/review/chapter-03-batch03-2026-11-19
  CH3_BATCH_C_REVIEW_VERSION: v04-perspective-corrections
  CH3_BATCH_D_REVIEW_COMMIT: 3931c496c13c691c8afa3c5206d4f56196c372fc
  CH3_BATCH_D_REVIEW_DIR: tools/prologue-art-lab/assets/review/chapter-03-batch04-2026-11-20/v01

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public storyboard files
        uses: actions/checkout@v4
      - name: Canonical drift check (chapters, routes, field contract, selected-art previews, status regression, game integration)
        run: node tools/sync/check-canon.mjs
      - name: Validate storyboard and artwork catalog
        run: node tools/storyboard/qa-smoke.mjs
      - name: Verify death-popup game export matches authored fatal boxes
        run: node tools/storyboard/export-death-presentations.mjs --check
      - name: Validate public prologue art source hashes and PNG dimensions
        run: node tools/prologue-art-lab/qa/qa-static.mjs
      - name: Build standalone public site
        run: |
          set -euo pipefail
          mkdir -p _site/tools/storyboard _site/story/chapters
          cp index.html _site/index.html
          cp tools/storyboard/index.html _site/tools/storyboard/index.html
          mkdir -p _site/tools/prologue-art-lab/assets
          cp tools/prologue-art-lab/index.html tools/prologue-art-lab/lab.css tools/prologue-art-lab/app.js tools/prologue-art-lab/pixel-type.js tools/prologue-art-lab/asset-index.json tools/prologue-art-lab/control-asset-manifest.json tools/prologue-art-lab/layout-reference.json tools/prologue-art-lab/bitmap-fonts.json tools/prologue-art-lab/artwork-audit.json tools/prologue-art-lab/exposition-v02.json tools/prologue-art-lab/exposition-v03.json _site/tools/prologue-art-lab/
          cp -a tools/prologue-art-lab/assets/. _site/tools/prologue-art-lab/assets/
          cp story/storyboard-manifest.json _site/story/storyboard-manifest.json
          cp story/items.draft.json _site/story/items.draft.json
          cp story/death-presentations.export.json _site/story/death-presentations.export.json
          cp story/artwork.draft.json _site/story/artwork.draft.json
          cp story/storyboard-layout.json _site/story/storyboard-layout.json
          cp story/chapter-03.reboot-review-layout.json _site/story/
          cp story/chapters/*.json _site/story/chapters/
          cp story/artwork-preview.json story/sync-contract.json _site/story/
          if [ -f story/game-integration.json ]; then cp story/game-integration.json _site/story/; fi
          mkdir -p _site/assets
          cp -a assets/selected _site/assets/selected
          test -s _site/story/artwork-preview.json
          node -e 'const p=require("./story/artwork-preview.json");const fs=require("fs");for(const [k,v] of Object.entries(p.images)){if(!fs.statSync("_site/"+v.file).size)throw Error(k)}console.log(Object.keys(p.images).length+" selected-art previews staged")'
          touch _site/.nojekyll
          test -s _site/tools/storyboard/index.html
          test -s _site/tools/prologue-art-lab/index.html
          test -s _site/tools/prologue-art-lab/asset-index.json
          test -s _site/tools/prologue-art-lab/layout-reference.json
          test -s _site/tools/prologue-art-lab/bitmap-fonts.json
          test -s _site/tools/prologue-art-lab/artwork-audit.json
          test -s _site/tools/prologue-art-lab/exposition-v02.json
          test -s _site/tools/prologue-art-lab/exposition-v03.json
          test -s _site/tools/prologue-art-lab/assets/draft/art/scenes/exposition/continuity-v03/entrance.png
          test -s _site/tools/prologue-art-lab/assets/draft/art/scenes/exposition/continuity-v03/facilities-corridor.png
          test -s _site/tools/prologue-art-lab/assets/draft/art/scenes/exposition/continuity-v02/entrance.png
          test -s _site/tools/prologue-art-lab/assets/draft/art/scenes/exposition/continuity-v02/property-intake.png
          test -s _site/tools/prologue-art-lab/control-asset-manifest.json
          test -s _site/tools/prologue-art-lab/assets/approved/art/actions/inspect.png
          test -s _site/tools/prologue-art-lab/assets/approved/art/ui/shell/layout-final.png
          test -s _site/story/storyboard-manifest.json
          test -s _site/story/chapters/prologue-00.draft.json
          test -s _site/story/items.draft.json
          test -s _site/story/death-presentations.export.json
          test -s _site/story/artwork.draft.json
          test -s _site/story/storyboard-layout.json
      # Historical Chapter 3 review galleries. They stay on their generation branches and are never
      # imported into main: each is sparse-checked-out at its immutable pinned commit, validated
      # against the checksum manifests it ships, and copied into _site at build time only.
      - name: Check out pinned Chapter 3 Batch A review gallery (build-time only)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CH3_BATCH_A_REVIEW_COMMIT }}
          path: .review-ch3-batch-a
          sparse-checkout: ${{ env.CH3_BATCH_A_REVIEW_DIR }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check out pinned Chapter 3 Batch B review gallery (build-time only)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CH3_BATCH_B_REVIEW_COMMIT }}
          path: .review-ch3-batch-b
          sparse-checkout: ${{ env.CH3_BATCH_B_REVIEW_DIR }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate and stage the Chapter 3 review galleries
        run: |
          set -euo pipefail
          A_SRC=.review-ch3-batch-a; B_SRC=.review-ch3-batch-b
          A=$CH3_BATCH_A_REVIEW_DIR; B=$CH3_BATCH_B_REVIEW_DIR
          # Exactly the pinned commits, and only the gallery directory from each.
          test "$(git -C "$A_SRC" rev-parse HEAD)" = "$CH3_BATCH_A_REVIEW_COMMIT"
          test "$(git -C "$B_SRC" rev-parse HEAD)" = "$CH3_BATCH_B_REVIEW_COMMIT"
          test -z "$(cd "$A_SRC" && find . -path ./.git -prune -o -type f -print | grep -v "^\./$A/")"
          test -z "$(cd "$B_SRC" && find . -path ./.git -prune -o -type f -print | grep -v "^\./$B/")"
          # Every checksum manifest the packages ship, checked where it was written.
          n=0
          for pair in "$A_SRC:$A" "$B_SRC:$B"; do
            src=${pair%%:*}; dir=${pair#*:}
            for sums in $(cd "$src" && find "$dir" -name '*SHA256SUMS.txt' ! -name 'BATCH_A_ARCHIVE_SHA256SUMS.txt' | sort); do
              (cd "$src/$(dirname "$sums")" && sha256sum --check --quiet "$(basename "$sums")"); n=$((n+1))
            done
          done
          # Batch B pins the whole Batch A archive (repo-root relative): every file, nothing extra.
          for sums in $(cd "$B_SRC" && find "$B" -name 'BATCH_A_ARCHIVE_SHA256SUMS.txt' | sort); do
            (cd "$A_SRC" && sha256sum --check --quiet "$GITHUB_WORKSPACE/$B_SRC/$sums"); n=$((n+1))
            test "$(wc -l < "$B_SRC/$sums")" -eq "$(find "$A_SRC/$A" -type f | wc -l)"
          done
          echo "$n review checksum manifests verified"
          # Stage byte-for-byte; never overwrite anything main already publishes.
          for d in "$A" "$B"; do test ! -e "_site/$d"; mkdir -p "_site/$(dirname "$d")"; done
          cp -a "$A_SRC/$A" "_site/$A"
          cp -a "$B_SRC/$B" "_site/$B"
          diff -r "$A_SRC/$A" "_site/$A"
          diff -r "$B_SRC/$B" "_site/$B"
          for f in "$A/index.html" "$A/v09-microphone-final-2026-11-19/index.html" "$B/index.html" "$B/v01/index.html" "$B/v02-additive-continuity/index.html" "$B/v03-localized-corrections/index.html"; do test -s "_site/$f"; done
          # Deployment metadata is written only into _site, never into the immutable packages. Gallery
          # labels from review time (generated / unselected) are left as historical provenance.
          for f in "$A/deployment-provenance.json" "$B/v03-localized-corrections/deployment-provenance.json" "$B/v02-additive-continuity/deployment-provenance.json"; do test ! -e "_site/$f"; done
          cp "$B_SRC/$B/v03-localized-corrections/sources/historical-v02-deployment-provenance.json" "_site/$B/v02-additive-continuity/deployment-provenance.json"
          A="$A" B="$B" python3 - <<'PY'
          import json, os
          site, main = '_site/', os.environ['GITHUB_SHA']
          def write(rel, data):
              with open(site + rel, 'w') as f: f.write(json.dumps(data, indent=2) + '\n')
          common = {'publicSiteSource': main, 'deployedBy': 'canonical main Pages workflow (.github/workflows/pages.yml)',
                    'gallery': 'Historical review gallery, byte-preserved from its pinned commit. Labels written at review time (generated / unselected) are kept as provenance and are superseded by the canonical registry.'}
          write(os.environ['A'] + '/deployment-provenance.json', {**common,
              'gallerySource': os.environ['CH3_BATCH_A_REVIEW_COMMIT'], 'galleryRef': 'art/ch3-pavilion-batch01-20261118',
              'approval': 'Chapter 3 Batch A A01-A06 owner-approved 2026-11-19 and registered in canonical main (docs/103 Chapter 3 Batch A section; story/artwork-preview.json). Approved, not integrated; production assetPath null. Original native-grid authorship unproven.'})
          write(os.environ['B'] + '/v03-localized-corrections/deployment-provenance.json', {**common,
              'gallerySource': os.environ['CH3_BATCH_B_REVIEW_COMMIT'], 'galleryRef': 'art/ch3-pavilion-batch02-20261119',
              'approval': 'Chapter 3 Batch B B01-B06 v03 owner-approved 2026-11-19 and registered in canonical main (docs/103 Chapter 3 Batch B section; docs/113; story/artwork-preview.json). Approved, not integrated; production assetPath null. Original native-grid authorship unproven.'})
          PY
          echo "Chapter 3 review galleries staged: $(find "_site/$A" -type f | wc -l) Batch A + $(find "_site/$B" -type f | wc -l) Batch B files"
      # All four review snapshots stay immutable; the current mixed-version approval lives outside them.
      - name: Check out pinned Chapter 3 Batch C review gallery (build-time only)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CH3_BATCH_C_REVIEW_COMMIT }}
          path: .review-ch3-batch-c
          sparse-checkout: ${{ env.CH3_BATCH_C_REVIEW_DIR }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate and stage selected v04 environments and retained v02 foregrounds
        run: |
          set -euo pipefail
          C_SRC=.review-ch3-batch-c; C=$CH3_BATCH_C_REVIEW_DIR
          test "$(git -C "$C_SRC" rev-parse HEAD)" = "$CH3_BATCH_C_REVIEW_COMMIT"
          test -z "$(cd "$C_SRC" && find . -path ./.git -prune -o -type f -print | grep -v "^\./$C/")"
          test -z "$(find "$C_SRC/$C" -type l -print)"
          # Only trusted main workflow/helpers execute; gallery files are data.
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          gallery = Path('.review-ch3-batch-c') / os.environ['CH3_BATCH_C_REVIEW_DIR']
          versions = ['v01', 'v02-localized-corrections', 'v03-continuity-corrections', os.environ['CH3_BATCH_C_REVIEW_VERSION']]
          manifests = {}
          for version, count in zip(versions, [8, 8, 7, 7]):
              root = gallery / version
              for name in ['PNG_SHA256SUMS.txt', 'SOURCE_SHA256SUMS.txt']:
                  for line in (root / name).read_text().splitlines():
                      digest, relative = line.split('  ', 1)
                      f = (root / relative).resolve()
                      assert f.is_relative_to(root.resolve())
                      assert hashlib.sha256(f.read_bytes()).hexdigest() == digest, (version, relative)
              m = json.loads((root / 'manifest.json').read_text())
              assert len(m['candidates']) == count
              assert len({c['candidateId'] for c in m['candidates']}) == count
              # Historical labels are provenance; the later owner decision is separate.
              assert m['selected'] is False and m['approved'] is False and m['assetPath'] is None
              for c in m['candidates']:
                  assert c['status'] == 'generated' and c['selected'] is False and c['approved'] is False and c['assetPath'] is None
                  f = (root / c['file']).resolve()
                  assert f.is_relative_to(root.resolve() / 'candidates')
                  assert hashlib.sha256(f.read_bytes()).hexdigest() == c['sha256']
              assert m['narrativeBlob'] == '857ffdf1bc9432cf4bbbfd7819f5f430a06d9036'
              manifests[version] = {c['candidateId']: c for c in m['candidates']}
          decision = json.loads(Path('docs/119_OUT_OF_ORDER_CH3_CURRENT_SELECTED_ARTWORK_20261120.json').read_text())
          batch = json.loads(Path('docs/119_OUT_OF_ORDER_CH3_CURRENT_APPROVAL_REGISTRATION_BATCH_20261120.json').read_text())
          expected = {
              'CH3-C01-urgency', 'CH3-C02-urgency-bg', 'CH3-C03-locomotion',
              'CH3-C04-surprise', 'CH3-C05-surprise-bg', 'CH3-A04-verification-continuity',
              'CH3-A05-verification-bg-continuity', 'CH3-C06-presenter-excited',
              'CH3-C07-presenter-alarmed', 'CH3-B07-attendant-alarmed',
          }
          assert len(decision['candidates']) == len(batch['entries']) == 10
          assert {c['candidateId'] for c in decision['candidates']} == expected
          assert decision['gallerySourceCommit'] == os.environ['CH3_BATCH_C_REVIEW_COMMIT']
          assert decision['galleryVersion'] == os.environ['CH3_BATCH_C_REVIEW_VERSION']
          assert decision['retainedForegroundSourceCommit'] == '5e0449b3da84764176f9744f5624a88868f5fdcb'
          assert decision['status'] == 'approved' and decision['selected'] and decision['approved']
          assert decision['gameplayIntegrationAuthorized'] is False and decision['beginBatchDAuthorized'] is False
          entries = {e['key']: e for e in batch['entries']}; assert len(entries) == 10
          for c in decision['candidates']:
              retained = c['retainedUnchanged']; version = 'v02-localized-corrections' if retained else decision['galleryVersion']
              prior = manifests[version][c['candidateId']]
              assert c['selectedVersion'] == ('v02' if retained else 'v04')
              assert c['key'] == prior['record'] and c['sha256'] == prior['sha256']
              assert c['file'] == os.environ['CH3_BATCH_C_REVIEW_DIR'] + '/' + version + '/' + prior['file']
              assert c['source']['path'] == c['file']
              assert c['source']['repo'] == 'InterstellarHarvest/CYOA-storyboard' and c['source']['ref'] == 'art/ch3-pavilion-batch03-20261119'
              assert c['source']['commit'] == (decision['retainedForegroundSourceCommit'] if retained else decision['gallerySourceCommit'])
              assert c['status'] == 'approved' and c['selected'] and c['approved'] and c['assetPath'] is None
              e = entries[c['key']]
              assert e['file'] == c['file'] and e['source'] == c['source'] and e['expectedSha256'] == c['sha256'] and e['status'] == 'approved'
              data = (Path('.review-ch3-batch-c') / c['file']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == c['sha256']
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == c['gitBlob']
          assert sum(c['retainedUnchanged'] for c in decision['candidates']) == 3
          assert sum(c['replacesCanonicalSelection'] for c in decision['candidates']) == 2
          history = decision['historicalOwnerDecision']; data = Path(history['file']).read_bytes()
          assert hashlib.sha256(data).hexdigest() == history['sha256']
          assert len(decision['supersededCanonicalSelections']) == 2
          for old in decision['supersededCanonicalSelections']:
              data = Path(old['preservedFile']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == old['sha256'] == old['priorSelectedPreview']['sha256']
              assert data == (gallery / old['galleryHistoricalReference']).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == old['priorPreviewGitBlob']
          print('Four immutable review versions, seven v04 environments, three v02 foregrounds, and two superseded approved originals verified')
          PYCODE
          node --input-type=module <<'JSCODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { decodePng } from './tools/sync/lib.mjs';
          const d=JSON.parse(fs.readFileSync('docs/119_OUT_OF_ORDER_CH3_CURRENT_SELECTED_ARTWORK_20261120.json','utf8'));
          for(const c of d.candidates){
            const p=decodePng(fs.readFileSync('.review-ch3-batch-c/'+c.file));
            assert.ok(p.decoded);assert.equal(p.depth,8);assert.equal(p.partial,0);
            assert.deepEqual([p.width,p.height],c.dimensions);
            assert.equal(p.colorType,c.retainedUnchanged?6:2);
            assert.ok(c.retainedUnchanged?p.transparent>0:p.transparent===0);
          }
          console.log('All ten native PNG contracts and binary-alpha foregrounds verified');
          JSCODE
          test ! -e "_site/$C"
          mkdir -p "_site/$(dirname "$C")"
          cp -a "$C_SRC/$C" "_site/$C"
          diff -r "$C_SRC/$C" "_site/$C"
          for v in v01 v02-localized-corrections v03-continuity-corrections "$CH3_BATCH_C_REVIEW_VERSION"; do test -s "_site/$C/$v/index.html"; done
          for f in deployment-provenance.json owner-selection.json owner-selection-v02-history.json selection.html; do test ! -e "_site/$C/$f"; done
          # Publish current approval and exact old decision outside every immutable version.
          python3 - <<'PYCODE'
          import html, json, os
          from pathlib import Path
          out = Path('_site') / os.environ['CH3_BATCH_C_REVIEW_DIR']
          decision_path = Path('docs/119_OUT_OF_ORDER_CH3_CURRENT_SELECTED_ARTWORK_20261120.json')
          decision = json.loads(decision_path.read_text())
          preview = json.loads(Path('story/artwork-preview.json').read_text())['images']
          registered = sum(preview.get(c['key'], {}).get('sha256') == c['sha256'] for c in decision['candidates'])
          data = {
              'publicSiteSource': os.environ['GITHUB_SHA'],
              'gallerySource': os.environ['CH3_BATCH_C_REVIEW_COMMIT'],
              'selectedReviewVersion': os.environ['CH3_BATCH_C_REVIEW_VERSION'],
              'selectedSourceCommits': {'sevenEnvironments': decision['gallerySourceCommit'], 'threeRetainedForegrounds': decision['retainedForegroundSourceCommit']},
              'deployedBy': 'canonical main Pages workflow (.github/workflows/pages.yml)',
              'creativeApproval': 'Nate selected seven v04 environments and retained three v02 foregrounds on 2026-11-20. A04/A05 explicitly supersede their earlier approved selections.',
              'canonicalExactSelectedPreviewCount': registered,
              'gameplayIntegration': 'Not authorized by this approval or publication.',
              'nativeGridAuthorship': 'Unresolved/unproven; accepted by Nate for the exact selected bytes.',
              'history': 'All four review versions remain byte-preserved. Historical unselected labels are superseded by owner-selection.json; original v02 decision is preserved separately.',
          }
          (out / 'deployment-provenance.json').write_text(json.dumps(data, indent=2) + '\n')
          (out / 'owner-selection.json').write_bytes(decision_path.read_bytes())
          (out / 'owner-selection-v02-history.json').write_bytes(Path(decision['historicalOwnerDecision']['file']).read_bytes())
          prefix = os.environ['CH3_BATCH_C_REVIEW_DIR'] + '/'
          rows = ''.join('<tr><td><a href="' + html.escape(c['file'][len(prefix):]) + '">' + html.escape(c['candidateId']) + '</a></td><td>' + c['selectedVersion'] + '</td><td><code>' + c['sha256'] + '</code></td></tr>' for c in decision['candidates'])
          history = ''.join('<li><a href="' + html.escape(c['galleryHistoricalReference']) + '">Prior approved ' + c['candidateId'] + '</a>: <code>' + c['sha256'] + '</code></li>' for c in decision['supersededCanonicalSelections'])
          page = '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Out of Order — current Chapter 3 selections</title><style>body{max-width:72rem;margin:2rem auto;padding:0 1rem;font:16px/1.6 system-ui}td,code,a{overflow-wrap:anywhere}td{padding:.5rem}table{table-layout:fixed;width:100%}</style><h1>Chapter 3 — Nate’s current selections</h1><p>Owner-approved 2026-11-20: seven v04 environments and three unchanged v02 foregrounds. A04/A05 explicitly replace their previous approved versions; older files and provenance remain historical records.</p><p><a href="' + os.environ['CH3_BATCH_C_REVIEW_VERSION'] + '/">Selected v04 environment gallery</a> · <a href="v02-localized-corrections/">Retained v02 foregrounds and history</a> · <a href="owner-selection.json">Current decision and provenance</a> · <a href="owner-selection-v02-history.json">Unchanged earlier owner decision</a></p><p>Original native-grid authorship remains unresolved/unproven and accepted by Nate. Canonical previews matching these exact selections: ' + str(registered) + '/10. No gameplay integration or Batch D is authorized.</p><table><tr><th>Selection</th><th>Version</th><th>SHA-256</th></tr>' + rows + '</table><h2>Superseded approved originals</h2><ul>' + history + '</ul><p>Historical generated/unselected labels inside review snapshots remain unchanged as provenance; the later owner decision above supersedes them.</p></html>'
          (out / 'selection.html').write_text(page)
          PYCODE
          for v in v01 v02-localized-corrections v03-continuity-corrections "$CH3_BATCH_C_REVIEW_VERSION"; do diff -r "$C_SRC/$C/$v" "_site/$C/$v"; done
      # Batch D remains generated/unselected. The protected main workflow publishes review data
      # from an immutable generation commit; no generation-branch deployment or gallery code runs.
      - name: Check out pinned Chapter 3 Batch D review gallery (build-time only)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CH3_BATCH_D_REVIEW_COMMIT }}
          path: .review-ch3-batch-d
          sparse-checkout: ${{ env.CH3_BATCH_D_REVIEW_DIR }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate and stage unselected Chapter 3 Batch D review gallery
        run: |
          set -euo pipefail
          test "$(git -C .review-ch3-batch-d rev-parse HEAD)" = "$CH3_BATCH_D_REVIEW_COMMIT"
          node tools/sync/stage-ch3-batch04-review.mjs .review-ch3-batch-d _site
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
