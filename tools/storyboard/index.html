<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Acceptable Error — Storyboard</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e2e8ee;background:#151b22;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,select{background:#27333e;border:1px solid #465563;color:inherit;padding:7px 10px;border-radius:5px;font:inherit;cursor:pointer}button:hover,select:hover{background:#334451}button:disabled{opacity:.5;cursor:default}input{font:inherit}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 15px;border-bottom:1px solid #37424d}header h1{margin:0 18px 0 0;font-size:16px}#status{color:#a8b8c4;margin-left:auto;font-size:12px}#app{display:grid;grid-template-columns:minmax(350px,1fr) 385px;height:calc(100vh - 70px);min-height:460px}.work{display:flex;flex-direction:column;min-width:0;border-right:1px solid #394551}.work-tools{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid #34404b;color:#a7b5c0}.work-tools strong{color:#e2e8ee}#viewport{flex:1;overflow:auto;background-image:radial-gradient(#2d3a45 1px,transparent 1px);background-size:18px 18px;cursor:grab}#viewport:active{cursor:grabbing}#space{position:relative}#stage{position:relative;transform-origin:top left}#edges{position:absolute;inset:0;overflow:visible;pointer-events:none}.node{position:absolute;min-height:86px;width:220px;padding:11px 12px;border:1px solid #5a6976;border-radius:7px;background:#26323e;cursor:pointer;box-shadow:0 3px 9px #0005}.node:hover{border-color:#b4ccd8;background:#34424e}.node.selected{border:2px solid #80bece;padding:10px 11px}.node .id{font-size:10px;color:#9db0be;margin-bottom:5px}.node .name{font-size:13px;font-weight:650;line-height:1.3}.node .sub{font-size:11px;color:#a3b3c1;margin-top:5px}.node .end{color:#dfb88c}aside{overflow:auto;padding:15px 17px}aside h2{font-size:17px;margin:0 0 5px}aside h3{font-size:13px;color:#b4c7d4;margin:18px 0 6px}aside p{line-height:1.5;white-space:pre-wrap;margin:6px 0 12px}aside .meta{font-size:11px;color:#a1afbb}.choice{display:block;text-align:left;width:100%;margin:7px 0;background:#25313c;padding:10px}.choice .minor{display:block;color:#a9b7c2;font-size:11px;margin-top:4px}aside pre{font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:#202a34;padding:11px;overflow:auto;white-space:pre-wrap;word-break:break-word;border-radius:5px}details{margin-top:16px}summary{cursor:pointer;font-weight:600;color:#bbced9}textarea{background:#101820;color:#e5eef6;border:1px solid #526470;border-radius:5px;width:100%;min-height:290px;resize:vertical;padding:10px;font:12px/1.5 ui-monospace,monospace;margin-top:10px}.muted{color:#a3b1bd}.item-button{display:block;width:100%;text-align:left;margin-top:8px}.warning{color:#e6bd8e}#fileChapter,#fileItems{display:none}@media(max-width:900px){#app{grid-template-columns:1fr;height:auto}.work{height:520px;border-right:0}aside{min-height:400px;border-top:1px solid #465563}}
</style>
</head>
<body>
<header>
<h1>The Acceptable Error · Storyboard</h1>
<select id="chapterSelect" title="Choose a chapter from external manifest"><option value="">Load a chapter</option></select>
<button id="openChapter">Import chapter JSON</button><input id="fileChapter" type="file" accept=".json,application/json">
<button id="openItems">Import items JSON</button><input id="fileItems" type="file" accept=".json,application/json">
<button id="exportChapter" disabled>Export chapter</button>
<button id="exportItems" disabled>Export items</button>
<span id="status">Starting…</span>
</header>
<div id="app">
 <section class="work">
  <div class="work-tools"><strong id="chapterTitle">Chapter tree</strong><span><button id="zoomOut" title="Zoom out">−</button> <button id="fit" title="Fit the board">Fit</button> <button id="zoomIn" title="Zoom in">+</button> <button id="showItems">Items</button></span></div>
  <div id="viewport"><div id="space"><div id="stage"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div></div>
 </section>
 <aside id="details"><h2>Choose a story node</h2><p class="muted">Select a node from the chapter tree. Hover for a summary. Click for its full text, choices, effects, and referenced artwork.</p><p class="muted">The story is kept in external JSON files; this page contains no chapter content.</p></aside>
</div>
<script>
(() => {
 "use strict";
 const $ = id => document.getElementById(id);
 const state = { chapter:null, items:{}, manifest:null, manifestURL:null, sourceName:"chapter.json", selected:null, scale:1, width:0, height:0 };
 const setStatus = message => { $("status").textContent = message; };
 const el = (tag, className, text) => { const n=document.createElement(tag); if(className)n.className=className;if(text!==undefined)n.textContent=text;return n; };
 const titleOf = (id) => id.replaceAll("_"," ").replace(/\b\w/g, m=>m.toUpperCase());
 function textOf(value) {
   if(typeof value==="string")return value;
   if(Array.isArray(value))return value.map(textOf).filter(Boolean).join("\n");
   if(value && typeof value==="object"){
     if(Object.hasOwn(value,"text"))return (value.if?"[IF "+JSON.stringify(value.if)+"] ":"")+textOf(value.text);
     for(const key of ["say","act","desc","think"])if(Object.hasOwn(value,key))return "["+key.toUpperCase()+"] "+value[key];
   }
   return "";
 }
 function choicesFor(node){return Array.isArray(node.choices)?node.choices:[];}
 function destinations(node){return choicesFor(node).map(c=>({id:c.to,choice:c})).filter(x=>x.id && state.chapter.nodes[x.id]);}
 function layout(){
   const nodes=state.chapter.nodes, ids=Object.keys(nodes), indegree=Object.fromEntries(ids.map(id=>[id,0])), depth=Object.fromEntries(ids.map(id=>[id,0]));
   ids.forEach(id=>destinations(nodes[id]).forEach(x=>indegree[x.id]++));
   const queue=ids.filter(id=>indegree[id]===0);
   let visited=0;
   while(queue.length && visited<ids.length){
     const id=queue.shift();visited++;
     destinations(nodes[id]).forEach(x=>{depth[x.id]=Math.max(depth[x.id],depth[id]+1);indegree[x.id]--;if(!indegree[x.id])queue.push(x.id);});
   }
   // Cycles are not expected in forward-moving chapter stories. Put any unplaced nodes at the end.
   if(visited<ids.length)ids.filter(id=>indegree[id]>0).forEach(id=>depth[id]=Math.max(...Object.values(depth))+1);
   const columns={};
   ids.forEach(id=>(columns[depth[id]]??=[]).push(id));
   const maxCount=Math.max(1,...Object.values(columns).map(x=>x.length));
   const positions={}; const cardWidth=220,cardHeight=86,stepX=340,stepY=130;
   for(const [col,entries] of Object.entries(columns)){
     entries.forEach((id,i)=>{positions[id]={x:50+Number(col)*stepX,y:65+(maxCount-entries.length)*stepY/2+i*stepY};});
   }
   return {positions,width:Math.max(650,120+(Math.max(...Object.values(depth))+1)*stepX),height:Math.max(400,135+maxCount*stepY),cardWidth,cardHeight};
 }
 function renderGraph(){
   if(!state.chapter)return;
   const {positions,width,height,cardWidth,cardHeight}=layout();
   state.width=width;state.height=height;
   const svg=$("edges");svg.replaceChildren();svg.setAttribute("width",width);svg.setAttribute("height",height);svg.setAttribute("viewBox","0 0 "+width+" "+height);
   const holder=$("nodes");holder.replaceChildren();
   for(const [id,node] of Object.entries(state.chapter.nodes)){
     const pos=positions[id], card=el("div","node"+(state.selected?.type==="node"&&state.selected.id===id?" selected":"" ));
     card.style.left=pos.x+"px";card.style.top=pos.y+"px";
     card.title=id+" · "+node.mode+"\n"+textOf(node.text).slice(0,240)+"\n"+choicesFor(node).length+" choices";
     card.append(el("div","id",id),el("div","name",titleOf(id)),el("div","sub"+(choicesFor(node).length===0?" end":""),node.mode+" · "+(choicesFor(node).length||"NO NEXT")+" choice"+(choicesFor(node).length===1?"":"s")));
     card.addEventListener("click",()=>selectNode(id));
     holder.append(card);
     for(const link of destinations(node)){
       const dest=positions[link.id];if(!dest)continue;
       const x1=pos.x+cardWidth,y1=pos.y+cardHeight/2,x2=dest.x,y2=dest.y+cardHeight/2;
       const mid=(x1+x2)/2;
       const path=document.createElementNS("http://www.w3.org/2000/svg","path");
       path.setAttribute("d","M"+x1+" "+y1+" C"+mid+" "+y1+" "+mid+" "+y2+" "+x2+" "+y2);
       path.setAttribute("fill","none");path.setAttribute("stroke","#79909f");path.setAttribute("stroke-width","1.5");
       svg.append(path);
       const arrow=document.createElementNS("http://www.w3.org/2000/svg","path");
       arrow.setAttribute("d","M"+(x2-7)+" "+(y2-4)+" L"+x2+" "+y2+" L"+(x2-7)+" "+(y2+4));
       arrow.setAttribute("fill","none");arrow.setAttribute("stroke","#a2b5c1");arrow.setAttribute("stroke-width","1.5");svg.append(arrow);
       if(choicesFor(node).length>1){
         const label=document.createElementNS("http://www.w3.org/2000/svg","text");
         label.setAttribute("x",mid);label.setAttribute("y",(y1+y2)/2-7);label.setAttribute("fill","#c0cbd4");label.setAttribute("font-size","10");label.setAttribute("text-anchor","middle");
         const s=link.choice.text||link.choice.id;
         label.textContent=s.length>23?s.slice(0,22)+"…":s;
         svg.append(label);
       }
     }
   }
   updateScale();
 }
 function updateScale(){
   $("stage").style.width=state.width+"px";$("stage").style.height=state.height+"px";
   $("stage").style.transform="scale("+state.scale+")";
   $("space").style.width=(state.width*state.scale)+"px";$("space").style.height=(state.height*state.scale)+"px";
 }
 function fit(){if(!state.chapter)return;const r=$("viewport");state.scale=Math.max(.25,Math.min(1.4,(r.clientWidth-24)/state.width,(r.clientHeight-24)/state.height));updateScale();}
 function detailHead(name,meta){const pane=$("details");pane.replaceChildren();pane.append(el("h2","",name),el("div","meta",meta));return pane;}
 function labeled(pane,label,content){pane.append(el("h3","",label),el("p","",content||"—"));}
 function editor(pane,value,commit){
   const section=el("details");const summary=el("summary","", "Edit JSON for this record");section.append(summary);
   const area=el("textarea");area.spellcheck=false;area.value=JSON.stringify(value,null,2);section.append(area);
   const save=el("button","","Apply JSON changes");save.addEventListener("click",()=>{try{const obj=JSON.parse(area.value);commit(obj);setStatus("Changes are in memory. Export JSON to save.");}catch(error){setStatus("Invalid JSON: "+error.message);}});section.append(save);
   pane.append(section);
 }
 function selectNode(id){
   const node=state.chapter?.nodes[id];if(!node)return;
   state.selected={type:"node",id};renderGraph();
   const pane=detailHead(titleOf(id),id+" · "+node.mode+" · "+(node.scene||state.chapter.scene||"no scene"));
   if(node.speaker||node.pose)pane.append(el("p","meta",["Speaker: "+(node.speaker||"—"),"Pose: "+(node.pose||"—")].join(" · ")));
   if(node.objective)labeled(pane,"Objective",textOf(node.objective));
   labeled(pane,"Actual script",textOf(node.text));
   pane.append(el("h3","","Choices & destinations"));
   choicesFor(node).forEach(c=>{
     const b=el("button","choice",c.text||c.id);
     const dest=c.to?"→ "+c.to:c.chapter?"→ Chapter "+c.chapter:c.back?"Return":"Stay / outcome";
     b.append(el("span","minor",(c.kind||"choice")+" · "+dest+(c.if?" · IF "+JSON.stringify(c.if):"")));
     if(c.to && state.chapter.nodes[c.to])b.addEventListener("click",()=>selectNode(c.to));else b.disabled=true;
     pane.append(b);
   });
   if(!choicesFor(node).length)pane.append(el("p","warning","No outgoing choice yet — story draft stops here."));
   if(node.effects)labeled(pane,"On arrival",JSON.stringify(node.effects,null,2));
   const marked=choicesFor(node).filter(c=>c.effects||c.check||c.pass||c.fail);
   if(marked.length){pane.append(el("h3","","Choice effects / checks"));marked.forEach(c=>pane.append(el("pre","",c.id+"\n"+JSON.stringify({effects:c.effects,check:c.check,pass:c.pass,fail:c.fail},(key,val)=>val===undefined?undefined:val,2))));}
   editor(pane,node,obj=>{if(!obj||typeof obj!=="object"||!Array.isArray(obj.choices))throw Error("Node must contain choices array");state.chapter.nodes[id]=obj;selectNode(id);});
 }
 function itemReferences(id){
   const result=[];const needle='"'+id+'"';
   Object.entries(state.chapter?.nodes||{}).forEach(([nodeId,node])=>{
     if(JSON.stringify(node.effects||{}).includes(needle))result.push(nodeId+" : arrival effects");
     const matches=choicesFor(node).filter(c=>JSON.stringify(c.effects||{}).includes(needle)||JSON.stringify(c.if||{}).includes(needle));
     if(matches.length)result.push(nodeId+" : "+matches.map(c=>c.id).join(", "));
   });
   Object.entries(state.items||{}).forEach(([sourceId,source])=>{
     if(JSON.stringify(source.inspect?.effects||{}).includes(needle))result.push("On inspecting item: "+sourceId);
   });
   return result;
 }
 function selectItem(id){
   const item=state.items[id];if(!item)return;
   state.selected={type:"item",id};renderGraph();
   const pane=detailHead(item.name||id,"Item ID: "+id);
   labeled(pane,"Inspection text",textOf(item.description));
   labeled(pane,"Inventory sprite",item.slotArt||"Artwork pending");
   labeled(pane,"Inspect illustration",item.inspectArt||"Artwork pending");
   if(item.inspect)labeled(pane,"On INSPECT (draft engine dependency)",JSON.stringify(item.inspect,null,2));
   if(item.read)labeled(pane,"READ effects",JSON.stringify(item.read,null,2));
   const refs=itemReferences(id);labeled(pane,"Referenced by choices",refs.length?refs.join("\n"):"No references found in this chapter");
   const back=el("button","","Back to item list");back.addEventListener("click",showItems);pane.append(back);
   editor(pane,item,obj=>{state.items[id]=obj;selectItem(id);});
 }
 function showItems(){
   state.selected={type:"list"};renderGraph();
   const pane=detailHead("Shared Item Library",Object.keys(state.items).length+" item record(s)");
   const ids=Object.keys(state.items);
   if(!ids.length)pane.append(el("p","muted","Load a shared items JSON file to inspect items."));
   ids.forEach(id=>{const b=el("button","item-button",(state.items[id].name||id)+" · "+id);b.addEventListener("click",()=>selectItem(id));pane.append(b);});
 }
 function loadChapter(data,name){
   if(!data?.nodes||!data?.start||!data.nodes[data.start])throw Error("Expected chapter with a valid start and nodes object.");
   state.chapter=data;state.sourceName=name||"chapter.json";state.selected=null;
   $("chapterTitle").textContent=data.title||name||"Chapter tree";
   $("exportChapter").disabled=false;renderGraph();fit();setStatus("Loaded "+Object.keys(data.nodes).length+" nodes · draft story JSON");
   selectNode(data.start);
 }
 async function loadRemote(entry){
   try{
     const url=new URL(entry.file,state.manifestURL);
     const res=await fetch(url);if(!res.ok)throw Error("HTTP "+res.status);
     loadChapter(await res.json(),entry.file.split("/").pop());
   }catch(err){setStatus("Could not load chapter: "+err.message);}
 }
 function download(data,name){
   const blob=new Blob([JSON.stringify(data,null,2)+"\n"],{type:"application/json"});
   const url=URL.createObjectURL(blob);const anchor=el("a");anchor.href=url;anchor.download=name;document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }
 async function loadManifest(){
   try{
     state.manifestURL=new URL("../../story/storyboard-manifest.json",location.href);
     const r=await fetch(state.manifestURL);if(!r.ok)throw Error("HTTP "+r.status);
     const manifest=await r.json();state.manifest=manifest;
     const select=$("chapterSelect");select.replaceChildren();
     (manifest.chapters||[]).forEach((entry,i)=>{const opt=el("option","",entry.title||entry.id);opt.value=String(i);select.append(opt);});
     if(manifest.items){const itemsRes=await fetch(new URL(manifest.items,state.manifestURL));if(itemsRes.ok){state.items=await itemsRes.json();$("exportItems").disabled=false;}}
     if(manifest.chapters?.length)await loadRemote(manifest.chapters[0]);else setStatus("No chapters listed in manifest.");
   }catch(err){setStatus("Import a chapter JSON file, or serve this repository over HTTP.");}
 }
 async function importFile(input,action){
   const file=input.files?.[0];if(!file)return;
   try{const obj=JSON.parse(await file.text());action(obj,file.name);}catch(err){setStatus("Cannot import JSON: "+err.message);}finally{input.value="";}
 }
 $("chapterSelect").addEventListener("change",e=>{const entry=state.manifest?.chapters?.[Number(e.target.value)];if(entry)loadRemote(entry);});
 $("openChapter").onclick=()=>$("fileChapter").click();
 $("openItems").onclick=()=>$("fileItems").click();
 $("fileChapter").onchange=e=>importFile(e.target,loadChapter);
 $("fileItems").onchange=e=>importFile(e.target,items=>{state.items=items;$("exportItems").disabled=false;showItems();setStatus("Item library loaded.");});
 $("exportChapter").onclick=()=>{if(state.chapter)download(state.chapter,state.sourceName);};
 $("exportItems").onclick=()=>download(state.items,"items.json");
 $("showItems").onclick=showItems;
 $("fit").onclick=fit;
 $("zoomIn").onclick=()=>{state.scale=Math.min(2,state.scale*1.2);updateScale();};
 $("zoomOut").onclick=()=>{state.scale=Math.max(.25,state.scale/1.2);updateScale();};
 let drag=null;
 $("viewport").addEventListener("pointerdown",e=>{if(e.target.closest(".node"))return;drag={x:e.clientX,y:e.clientY,left:$("viewport").scrollLeft,top:$("viewport").scrollTop};});
 window.addEventListener("pointermove",e=>{if(!drag)return;$("viewport").scrollLeft=drag.left-(e.clientX-drag.x);$("viewport").scrollTop=drag.top-(e.clientY-drag.y);});
 window.addEventListener("pointerup",()=>{drag=null;});
 loadManifest();
})();
</script>
</body>
</html>
